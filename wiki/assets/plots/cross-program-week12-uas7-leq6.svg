ext-anchor='middle'>34.3%</text><text x='905.0' y='454.0' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='400' fill='#17212b' text-anchor='middle'>1200 mg/day</text><text x='849.0' y='486.0' font-family='Inter, Arial, sans-serif' font-size='15' font-weight='700' fill='#17212b' text-anchor='middle'>Rilzabrutinib</text><text x='32.0' y='290.0' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='400' fill='#5c6b7a' text-anchor='middle'>Patients with UAS7 ≤ 6 (%)</text><g transform='rotate(-90 32 290.0)'></g><text x='44.0' y='480.0' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='400' fill='#5c6b7a' text-anchor='start'>Remibrutinib uses pooled REMIX-1 and REMIX-2 week-12 UAS7 ≤ 6 values. Barzolvolimab uses the best explicit active core-arm week-12 value, with placebo from the same phase-2 source layer.</text><text x='44.0' y='502.0' font-family='Inter, Arial, sans-serif' font-size='13' font-weight='400' fill='#5c6b7a' text-anchor='start'>Rilzabrutinib uses the week-12 1200 mg/day versus placebo snapshot from the primary analysis population. This is a comparison page, not a meta-analysis.</text></svg>