<svg xmlns='http://www.w3.org/2000/svg' width='1120' height='600' viewBox='0 0 1120 600'><rect x='0.0' y='0.0' width='1120.0' height='600.0' rx='0' fill='#ffffff' stroke='none' /><text x='44.0' y='46.0' font-family='Inter, Arial, sans-serif' font-size='28' font-weight='700' fill='#17212b' text-anchor='start'>Cross-program week 12 UAS7 ≤ 6 comparison, first pass</text><text x='44.0' y='74.0' font-family='Inter, Arial, sans-serif' font-size='15' font-weight='400' fill='#5c6b7a' text-anchor='start'>Explicit numeric week-12 well-controlled-disease landmarks only. Active-arm choices are intentionally conservative and shown exactly as the current local source layer allows.</text><rect x='86.0' y='116.0' width='908.0' height='420.0' rx='14' fill='#fbfdff' stroke='#d8e1ec' /><rect x='760.0' y='112.0' width='16.0' height='16.0' rx='3' fill='#6f7f8f' stroke='none' /><text x='784.0' y='125.0' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='400' fill='#17212b' text-anchor='start'>Placebo / placebo-containing comparator</text><rect x='760.0' y='138.0' width='16.0' height='16.0' rx='3' fill='#1f5aa6' stroke='none' /><text x='784.0' y='151.0' font-family='Inter, Arial, sans-serif' font-size='14' font-weight='400' fill='#17212b' text-anchor='start'>Best explicit active landmark for that program</text><line x1='110.0' y1='430.0' x2='970.0' y2='430.0' stroke='#d8e1ec' stroke-width='1' /><text x='100.0' y='435.0' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='400' fill='#5c6b7a' text-anchor='end'>0</text><line x1='110.0' y1='395.0' x2='970.0' y2='395.0' stroke='#d8e1ec' stroke-width='1' /><text x='100.0' y='400.0' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='400' fill='#5c6b7a' text-anchor='end'>10</text><line x1='110.0' y1='360.0' x2='970.0' y2='360.0' stroke='#d8e1ec' stroke-width='1' /><text x='100.0' y='365.0' font-family='Inter, Arial, sans-serif' font-size='12' font-weight='400' fill='#5c6b7a' text-anchor='end'>20</tex